<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMM Wallpapers Upload Configuration</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101114; color: #f5f5f5; }
    main { max-width: 720px; margin: auto; padding: 24px 16px 48px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #aeb3be; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; color: #d6dae3; }
    input, select, button {
      box-sizing: border-box; width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid #3b404c; background: #1b1e25; color: inherit; font: inherit;
    }
    input[type="checkbox"] { width: auto; }
    .check { display: flex; align-items: center; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { border: 0; background: #7c5cff; font-weight: 700; cursor: pointer; }
    #status { min-height: 1.4em; color: #8fe3a1; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>TMM Wallpapers upload configuration</h1>
  <p id="device"></p>
  <form id="config">
    <label class="check"><input id="enabled" type="checkbox"> Enable backup on this phone</label>
    <label>Upload interval (seconds)<input id="interval_seconds" type="number" min="30" step="1"></label>
    <div class="row">
      <label>Start hour (0–23)<input id="start_hour" type="number" min="0" max="23"></label>
      <label>End hour (0–23)<input id="end_hour" type="number" min="0" max="23"></label>
    </div>
    <label class="check"><input id="wifi_only" type="checkbox"> Upload only on Wi-Fi</label>
    <label>Folders (comma-separated)<input id="folders" type="text"></label>
    <label>Extensions (comma-separated)<input id="extensions" type="text"></label>
    <label class="check"><input id="upload_existing" type="checkbox"> Upload existing media</label>
    <label>Minimum file age (seconds)<input id="min_age_seconds" type="number" min="0"></label>
    <label>Maximum file size (bytes)<input id="max_bytes" type="number" min="1"></label>
    <button type="submit">Save configuration</button>
    <div id="status" role="status"></div>
  </form>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const deviceId = params.get("device_id") || "";
  const token = params.get("token") || "";
  const device = document.querySelector("#device");
  const status = document.querySelector("#status");
  device.textContent = `Device: ${deviceId}`;
  const field = id => document.querySelector(`#${id}`);
  const list = value => Array.isArray(value) ? value.join(", ") : "";
  function fill(config) {
    ["enabled", "wifi_only", "upload_existing"].forEach(id => field(id).checked = !!config[id]);
    ["interval_seconds", "start_hour", "end_hour", "min_age_seconds", "max_bytes"]
      .forEach(id => field(id).value = config[id]);
    field("folders").value = list(config.folders);
    field("extensions").value = list(config.extensions);
  }
  async function load() {
    const response = await fetch(`/v1/device/config?device_id=${encodeURIComponent(deviceId)}&token=${encodeURIComponent(token)}`);
    if (!response.ok) throw new Error("Unable to load configuration");
    fill(await response.json());
  }
  field("config").addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "Saving…";
    const body = {
      enabled: field("enabled").checked,
      interval_seconds: Number(field("interval_seconds").value),
      start_hour: Number(field("start_hour").value),
      end_hour: Number(field("end_hour").value),
      wifi_only: field("wifi_only").checked,
      folders: field("folders").value.split(",").map(value => value.trim()).filter(Boolean),
      extensions: field("extensions").value.split(",").map(value => value.trim().toLowerCase()).filter(Boolean),
      upload_existing: field("upload_existing").checked,
      min_age_seconds: Number(field("min_age_seconds").value),
      max_bytes: Number(field("max_bytes").value)
    };
    try {
      const response = await fetch(`/v1/device/config?device_id=${encodeURIComponent(deviceId)}&token=${encodeURIComponent(token)}`, {
        method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error("Unable to save configuration");
      fill(await response.json());
      status.textContent = "Saved.";
    } catch (error) {
      status.textContent = error.message;
    }
  });
  load().catch(error => status.textContent = error.message);
</script>
</body>
</html>
