<style>
/* ---- photo editor ---- */
.ed { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #0f0d13; color: #fff;
  --ep: #d0bcff; --eon: #381e72; --ec: #4a4458; user-select: none; -webkit-user-select: none; overscroll-behavior: contain; }
.ed[hidden] { display: none; }
.ed .ib { color: #fff; }
.ed .ib:hover { background: rgba(255,255,255,.12); }
.ed .ib:disabled { opacity: .35; }
.ed-top { flex: none; display: flex; align-items: center; gap: 2px;
  padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left)); }
.ed-title { font-size: 1.125rem; font-weight: 500; padding: 0 8px; white-space: nowrap; }
.ed-save { flex: none; height: 40px; padding: 0 20px; margin-left: 6px; border: 0; border-radius: 20px; cursor: pointer;
  font: inherit; font-size: .875rem; font-weight: 500; background: var(--ep); color: var(--eon); }
.ed-save:disabled { opacity: .5; cursor: default; }
.ed-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: grid; place-items: center; touch-action: none; }
.ed-frame { position: relative; touch-action: none; }
.ed-frame canvas { display: block; box-shadow: 0 2px 14px rgba(0,0,0,.55); background: #222; }
.crop { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); border: 1.5px solid #fff; cursor: move; touch-action: none; }
.crop[hidden] { display: none; }
.crop::before, .crop::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.crop::before { background: linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.crop::after { background: linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.crop i { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; }
.crop i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); }
.crop i.n::after, .crop i.s::after { width: 28px; height: 5px; margin: -2.5px -14px; border-radius: 3px; }
.crop i.e::after, .crop i.w::after { width: 5px; height: 28px; margin: -14px -2.5px; border-radius: 3px; }
.crop i.nw { left: 0; top: 0; cursor: nwse-resize; } .crop i.n { left: 50%; top: 0; cursor: ns-resize; } .crop i.ne { left: 100%; top: 0; cursor: nesw-resize; }
.crop i.e { left: 100%; top: 50%; cursor: ew-resize; } .crop i.se { left: 100%; top: 100%; cursor: nwse-resize; } .crop i.s { left: 50%; top: 100%; cursor: ns-resize; }
.crop i.sw { left: 0; top: 100%; cursor: nesw-resize; } .crop i.w { left: 0; top: 50%; cursor: ew-resize; }
.ed-busy { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 14px; background: rgba(0,0,0,.55); font-size: .9375rem; }
.ed-busy[hidden] { display: none; }
.ed-spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }

.ed-panel { flex: none; background: #1c1a21; }
.ed-tools { padding: 12px 16px 6px; min-height: 152px; display: flex; flex-direction: column; justify-content: center; }
.ed .pn { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ed .pn[hidden] { display: none; }
.ed .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.ed .chips::-webkit-scrollbar, .ed .swatches::-webkit-scrollbar, .ed .fil-row::-webkit-scrollbar { display: none; }
.ed .chips button { flex: none; position: relative; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid #5b5663; background: transparent;
  color: #e6e0e9; font: inherit; font-size: .8125rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.ed .chips button.on { background: var(--ec); border-color: transparent; color: #fff; }
.ed .chips button:disabled { opacity: .4; cursor: default; }
.ed .chips button.dot::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ep); }
.ed .chips button.acc { background: var(--ep); color: var(--eon); border-color: transparent; }
.ed .chips button[hidden] { display: none; }
.ed .sl { display: flex; align-items: center; gap: 12px; font-size: .8125rem; color: #cac4d0; }
.ed .sl span { flex: none; min-width: 66px; }
.ed .sl input { flex: 1; min-width: 0; height: 32px; accent-color: var(--ep); }
.ed .sl output { flex: none; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
.ed .swatches { display: flex; gap: 10px; overflow-x: auto; padding: 3px 3px 5px; }
.ed .swatches button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); padding: 0; cursor: pointer; }
.ed .swatches button.on { border-color: #fff; box-shadow: 0 0 0 2px var(--ep); }
.ed .rowbtns { display: flex; align-items: center; justify-content: space-between; gap: 4px; max-width: 320px; }
.ed .rowbtns .ib { width: 44px; height: 44px; }
.ed .rowbtns .vflip svg { transform: rotate(90deg); }
.ed .fil-row { display: flex; gap: 10px; overflow-x: auto; padding: 3px 3px 5px; }
.ed .fil { flex: none; width: 72px; padding: 0; border: 0; background: transparent; color: #cac4d0; font: inherit; font-size: .6875rem; text-align: center; cursor: pointer; }
.ed .fil canvas { width: 72px; height: 72px; border-radius: 12px; display: block; margin-bottom: 5px; outline: 2px solid transparent; outline-offset: 1px; }
.ed .fil.on { color: #fff; } .ed .fil.on canvas { outline-color: var(--ep); }
.ed .hint { font-size: .75rem; color: #a8a3b0; margin: -4px 0 0; }
.ed-tabs { display: flex; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: #211f26; }
.ed-tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: transparent;
  color: #cac4d0; font: inherit; font-size: .6875rem; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ed-tabs .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }
.ed-tabs button.on { color: #fff; } .ed-tabs button.on .pill { background: var(--ec); }
@media (max-height: 560px) { .ed-tools { min-height: 0; padding-top: 6px; } .ed-tabs .pill { height: 24px; } }

<script>
/* ================= photo editor =================
   Everything happens in the browser on a <canvas>. "Save copy" renders the full-size result and uploads it as a
   NEW photo (the original stays untouched). Geometry edits (crop / rotate / flip) are committed to a new bitmap;
   colour edits, filters, drawings and text stay editable until the copy is saved. */
const ed = {
  open: false, id: 0, base: null, proxy: null, thumbsFor: null, angle: 0,
  adj: { b: 0, c: 0, s: 0, w: 0, f: 0, sh: 0, v: 0 }, filter: 'none', fstr: 100,
  ann: [], sel: -1, hist: [], hi: -1, saved: false,
  tab: 'adjust', ratio: null, crop: { x: 0, y: 0, w: 1, h: 1 }, cw: 1, ch: 1,
  busy: false, token: 0, adjKey: 'b', tool: 'pen', color: '#ff3b30', size: 6,
  tcolor: '#ffffff', tsize: 8, tbg: false, raf: 0,
};

(() => {
  const ED = $('ed'), cv = $('edCv'), frame = $('edFrame'), cropEl = $('edCrop'), stageEl = $('edStage');
  const MAX_EDIT = 4000;   // longest side of the editable copy (keeps phones from running out of memory)
  const PROXY = 1600;      // longest side of the live preview
  const COLORS = ['#ffffff', '#000000', '#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7be', '#0a84ff', '#bf5af2', '#ff2d95'];
  const ZERO = { b: 0, c: 0, s: 0, w: 0, f: 0, sh: 0, v: 0 };
  const ADJ = [['b', 'Brightness', -100, 100], ['c', 'Contrast', -100, 100], ['s', 'Saturation', -100, 100], ['w', 'Warmth', -100, 100],
               ['f', 'Fade', 0, 100], ['sh', 'Sharpen', 0, 100], ['v', 'Vignette', -100, 100]];
  const FILTERS = [['none', 'Original'], ['vivid', 'Vivid'], ['bright', 'Bright'], ['warm', 'Warm'], ['cool', 'Cool'], ['fade', 'Fade'],
                   ['vintage', 'Vintage'], ['drama', 'Dramatic'], ['mono', 'Mono'], ['noir', 'Noir'], ['sepia', 'Sepia']];
  const PRESETS = {
    vivid: { s: 35, c: 15, b: 5 }, bright: { b: 20, c: 8, s: 10 }, warm: { w: 35, s: 10, b: 3 }, cool: { w: -35, s: 5 },
    fade: { f: 50, c: -12, s: -10, b: 4 }, vintage: { sepia: .45, f: 35, w: 18, v: 30, c: -5 },
    drama: { c: 35, s: -15, b: -5, v: 30, sh: 30 }, mono: { s: -100, c: 12 }, noir: { s: -100, c: 40, b: -8, v: 35 },
    sepia: { sepia: 1, s: -20, f: 10 },
  };

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const clone = x => JSON.parse(JSON.stringify(x));
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 16)));
  const set = (id, fn) => { $(id).onclick = fn; };

  /* ---------- colour pipeline (works at any size: preview and full-size export share it) ---------- */
  function params(adj, filter, str) {
    const p = PRESETS[filter] || {}, k = str / 100;
    const g = key => (adj[key] || 0) + (p[key] || 0) * k;
    return { b: clamp(g('b'), -100, 100), c: clamp(g('c'), -100, 100), s: clamp(g('s'), -100, 100), w: clamp(g('w'), -100, 100),
             f: clamp(g('f'), 0, 100), sh: clamp(g('sh'), 0, 100), v: clamp(g('v'), -100, 100), sepia: (p.sepia || 0) * k };
  }
  const effective = () => params(ed.adj, ed.filter, ed.fstr);

  function adjustPixels(ctx, w, h, P) {
    if (!P.b && !P.c && !P.s && !P.w && !P.f && !P.sepia && !P.v && !P.sh) return;
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    const lut = new Uint8ClampedArray(256), gam = Math.pow(2, -P.b / 60), cf = P.c >= 0 ? 1 + P.c / 80 : 1 + P.c / 100;
    for (let i = 0; i < 256; i++) lut[i] = (255 * Math.pow(i / 255, gam) - 128) * cf + 128;
    const sat = 1 + P.s / 100, wm = P.w * 0.35, fd = P.f / 100, sp = P.sepia, vg = P.v / 100;
    const cx = w / 2, cy = h / 2, inv = 1 / (cx * cx + cy * cy);
    const doLut = P.b || P.c, doSat = P.s !== 0;
    if (doLut || doSat || wm || fd || sp || vg) {
      for (let y = 0, i = 0; y < h; y++) {
        const dy = y - cy, dy2 = dy * dy;
        for (let x = 0; x < w; x++, i += 4) {
          let r = d[i], g = d[i + 1], b = d[i + 2];
          if (doLut) { r = lut[r]; g = lut[g]; b = lut[b]; }
          if (wm) { r += wm; b -= wm; }
          if (doSat) { const l = .299 * r + .587 * g + .114 * b; r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat; }
          if (fd) { const k = 1 - fd * .25, o = fd * 34; r = r * k + o; g = g * k + o; b = b * k + o; }
          if (sp) {
            const tr = .393 * r + .769 * g + .189 * b, tg = .349 * r + .686 * g + .168 * b, tb = .272 * r + .534 * g + .131 * b;
            r += (tr - r) * sp; g += (tg - g) * sp; b += (tb - b) * sp;
          }
          if (vg) { const dx = x - cx, f = 1 - vg * (dx * dx + dy2) * inv * .85; r *= f; g *= f; b *= f; }
          d[i] = r; d[i + 1] = g; d[i + 2] = b;
        }
      }
    }
    if (P.sh > 0 && w > 2 && h > 2) {   // sharpen with a rolling 3-row window (no full copy of the image)
      const k = P.sh / 100 * 0.9, rl = w * 4;
      let prev = new Uint8ClampedArray(d.subarray(0, rl)), cur = new Uint8ClampedArray(rl);
      for (let y = 1; y < h - 1; y++) {
        cur.set(d.subarray(y * rl, (y + 1) * rl));
        const row = y * rl, nxt = row + rl;
        for (let x = 4; x < rl - 4; x += 4) {
          for (let c = 0; c < 3; c++) {
            const j = x + c;

  ED.querySelector('.ed-tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });

  /* ---------- open / close / save ---------- */
  function busy(msg) { ed.busy = !!msg; $('edBusy').hidden = !msg; if (msg) $('edBusyT').textContent = msg; histUI(); }
  function loadImg(blob) {
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(blob), i = new Image();
      i.onload = () => { URL.revokeObjectURL(u); res(i); };
      i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
      i.src = u;
    });
  }
  function closeNow() {
    ed.token++; ed.open = false; ED.hidden = true; ed.base = ed.proxy = ed.thumbsFor = null; ed.hist = []; ed.hi = -1; ed.ann = []; ed.sel = -1;
    tmpFrame = null; cv.width = cv.height = 1; $('filRow').innerHTML = ''; busy('');
  }
  async function openEditor() {
    const it = items[lb.i]; if (!it || ed.open) return;
    stopSlides(); $('sheet').hidden = true;
    const token = ++ed.token;
    Object.assign(ed, { open: true, saved: false, id: it.id, base: null, proxy: null, thumbsFor: null, angle: 0, adj: { ...ZERO }, filter: 'none', fstr: 100,
      ann: [], sel: -1, hist: [], hi: -1, ratio: null, crop: { x: 0, y: 0, w: 1, h: 1 }, adjKey: 'b' });
    ED.hidden = false; history.pushState({ ed: 1 }, '');
    $('cropRatios').querySelectorAll('button[data-r]').forEach(b => b.classList.toggle('on', b.dataset.r === 'free'));
    setTab('adjust'); histUI(); busy('Opening photo…');
    try {
      const r = await api(`/vault/img/${it.id}/full`);
      if (!r.ok) throw new Error('load');
      const img = await loadImg(await r.blob());
      if (token !== ed.token) return;
      const k = Math.min(1, MAX_EDIT / Math.max(img.naturalWidth, img.naturalHeight));
      const base = mk(Math.max(1, Math.round(img.naturalWidth * k)), Math.max(1, Math.round(img.naturalHeight * k)));
      const bx = base.getContext('2d'); bx.imageSmoothingQuality = 'high'; bx.drawImage(img, 0, 0, base.width, base.height);
      ed.base = base; buildProxy(); syncControls(); pushHist(); renderNow(); fitFrame(); busy('');
    } catch (_) {
      if (token === ed.token) { toast('Could not open this photo for editing.'); ed.saved = true; history.back(); }
    }
  }
  $('lbEdit').onclick = openEditor;

  function requestClose() {
    if (!ed.open) return;
    if (!isDirty()) { history.back(); return; }
    confirmDialog('Discard your edits?', 'This photo has changes that haven\u2019t been saved.', 'Discard').then(ok => { if (ok) { ed.saved = true; history.back(); } });
  }
  set('edClose', requestClose);
  // the main script calls this on every popstate (phone Back button / swipe): true = the editor handled it
  window.editorPop = () => {
    if (!ed.open) return false;
    if (!isDirty()) { closeNow(); return true; }
    confirmDialog('Discard your edits?', 'This photo has changes that haven\u2019t been saved.', 'Discard')
      .then(ok => { if (ok) closeNow(); else history.pushState({ ed: 1 }, ''); });
    return true;
  };

  async function exportBlob() {
    const src = frameOf(ed.base, ed.angle, true), w = src.width, h = src.height;
    const out = mk(w, h), ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(src, 0, 0);
    adjustPixels(ctx, w, h, effective());
    drawAnn(ctx, w, h, ed.ann, false);
    return new Promise((res, rej) => out.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.92));
  }
  async function saveCopy() {
    if (ed.busy || !ed.base) return;
    applyCrop();
    if (ed.hi <= 0) { toast('Make a change first, then save.'); return; }
    busy('Saving a copy…'); await nextFrame();
    try {
      const blob = await exportBlob();
      busy('Uploading to Telegram…');
      const fd = new FormData(); fd.append('file', blob, 'edited.jpg'); fd.append('source_id', ed.id);
      const d = await (await api('/vault/api/edit/save', { method: 'POST', headers: { 'X-Vault': '1' }, body: fd })).json();
      if (!d.ok) throw new Error(d.error || 'Upload failed.');
      needsRefresh = true; ed.saved = true; busy('');
      toast('Saved a copy to your vault'); history.back();
    } catch (e) {
      busy(''); toast(e && e.message && e.message !== 'signed out' ? e.message : 'Could not save the copy.');
    }
  }
  set('edSave', saveCopy);

  document.addEventListener('keydown', e => {
    if (!ed.open || document.querySelector('dialog[open]')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') requestClose();
    else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  });
})();
</script>
